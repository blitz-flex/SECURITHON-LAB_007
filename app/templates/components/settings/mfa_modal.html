<div
    id="mfa-setup-modal"
    class="settings-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="mfa-modal-title"
    aria-describedby="mfa-modal-desc"
    aria-hidden="true"
>
    <div class="mfa-modal-panel" role="document">
        <header class="mfa-modal-header">
            <h2 id="mfa-modal-title"><i class="fas fa-envelope-shield"></i> Email 2FA Setup</h2>
        </header>


        <div class="mfa-modal-body">
            <div id="mfa-setup-loading" class="mfa-setup-loading" role="status" aria-live="polite">
                <span>Preparing OTP code…</span>
            </div>

            <div id="mfa-setup-success" class="mfa-setup-success" hidden role="status" aria-live="polite">
                <p><i class="fas fa-check-circle" style="color:#34d399;"></i> Email Two-Factor Authentication is now enabled!</p>
            </div>

            <div id="mfa-setup-body" class="mfa-setup-body" hidden>
                <p id="mfa-modal-desc" class="panel-desc mfa-modal-desc">
                    A 6-digit OTP verification code has been generated. Enter the code to verify and enable Email 2FA.
                </p>

                <div class="form-group mfa-code-group">
                    <label class="form-label" for="mfa-code-input">
                        <i class="fas fa-key label-icon"></i> 6-Digit OTP Code
                    </label>
                    <input
                        type="text"
                        id="mfa-code-input"
                        class="form-control mfa-code-field"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        placeholder="000000"
                        aria-describedby="mfa-code-hint"
                    >
                    <p id="mfa-code-hint" class="form-hint mfa-code-hint">Enter the 6-digit verification code sent to your Email.</p>
                </div>
            </div>

            <p class="form-error mfa-modal-error" id="mfa-modal-error" role="alert" hidden></p>
        </div>

        <footer class="mfa-modal-footer">
            <button type="button" class="btn btn-secondary" id="mfa-modal-cancel">Cancel</button>
            <button type="button" class="btn btn-primary" id="mfa-modal-verify">Verify & Enable</button>
        </footer>
    </div>
</div>
