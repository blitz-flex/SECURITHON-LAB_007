<!-- Tab: Fleet -->
<div id="tab-fleet" class="tab-content {% if active_admin_tab == 'fleet' %}active{% endif %}">
<style>
    /* ── Fleet Tab Premium Styles ── */

    /* Stat Cards */
    .fleet-stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 20px;
    }
    .fleet-stat-card {
        position: relative;
        padding: 18px 20px;
        border-radius: 14px;
        background: var(--bg-panel, rgba(15,15,17,0.65));
        display: flex;
        align-items: center;
        gap: 14px;
        transition: transform 0.22s ease, background 0.22s ease;
        overflow: hidden;
    }
    .fleet-stat-card::before {
        content: '';
        position: absolute;
        left: 0; top: 14px; bottom: 14px;
        width: 2px;
        border-radius: 2px;
        background: var(--fsc, var(--primary));
        opacity: 0.7;
    }
    .fleet-stat-card:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.03);
    }
    .fleet-stat-icon {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(var(--fsc-rgb, 0,229,155), 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        color: var(--fsc, var(--primary));
        flex-shrink: 0;
    }
    .fleet-stat-info {}
    .fleet-stat-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        font-family: var(--font-data);
        margin-bottom: 4px;
    }
    .fleet-stat-value {
        font-size: 1.6rem;
        font-weight: 800;
        font-family: var(--font-data);
        color: var(--fsc, var(--primary));
        line-height: 1;
    }

    /* Main Layout - Fixed Height with Independent Panel Scroll */
    .fleet-main-grid {
        display: grid;
        grid-template-columns: 1fr 290px;
        gap: 16px;
        height: calc(100vh - 270px);
        min-height: 450px;
    }

    /* Left Panel (Operatives) */
    .fleet-panel {
        border-radius: 16px;
        background: var(--bg-panel, rgba(15,15,17,0.65));
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
        height: 100%;
        border: 1px solid rgba(255,255,255,0.05);
    }

    .fleet-panel-head {
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        background: rgba(0,0,0,0.2);
        flex-shrink: 0;
        flex-wrap: wrap;
    }
    .fleet-panel-title {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--text-main, #f3f4f6);
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 1px;
        font-family: var(--font-ui);
    }
    .fleet-panel-title i {
        color: var(--primary);
    }

    /* Search Input */
    .fleet-search-wrap {
        position: relative;
        display: flex;
        align-items: center;
    }
    .fleet-search-wrap i {
        position: absolute;
        left: 10px;
        color: var(--text-muted);
        font-size: 0.75rem;
        pointer-events: none;
    }
    #fleetSearch {
        padding: 7px 12px 7px 30px;
        width: 210px;
        background: rgba(0,0,0,0.4);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 8px;
        color: var(--text-main, #fff);
        font-size: 0.78rem;
        font-family: var(--font-ui);
        outline: none;
        transition: border-color 0.2s, background 0.2s;
    }
    #fleetSearch::placeholder { color: var(--text-muted); opacity: 0.6; }
    #fleetSearch:focus {
        border-color: rgba(0,229,155,0.4);
        background: rgba(0,0,0,0.6);
    }

    /* Table Grid Columns Structure */
    .fleet-table-head, .fleet-row {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr 0.9fr 1.2fr 1.1fr 65px;
        gap: 10px;
        align-items: center;
    }
    .fleet-table-head > div,
    .fleet-row > div {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
    }
    .fleet-row > div:first-child,
    .fleet-table-head > div:first-child {
        justify-content: flex-start;
        text-align: left;
    }

    .fleet-table-head {
        padding: 12px 20px;
        font-size: 0.65rem;
        color: var(--text-muted);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        font-family: var(--font-data);
        flex-shrink: 0;
        background: rgba(0,0,0,0.3);
        user-select: none;
    }

    /* Table Body Scrollable Container */
    .fleet-table-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto !important;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: rgba(0,229,155,0.3) rgba(0,0,0,0.2);
    }
    .fleet-table-body::-webkit-scrollbar {
        width: 6px;
    }
    .fleet-table-body::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.2);
    }
    .fleet-table-body::-webkit-scrollbar-thumb {
        background: rgba(0,229,155,0.25);
        border-radius: 3px;
    }
    .fleet-table-body::-webkit-scrollbar-thumb:hover {
        background: var(--primary, #00e59b);
    }

    .fleet-row {
        padding: 11px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.025);
        font-size: 0.8rem;
        color: var(--text-main);
        font-weight: 500;
        cursor: default;
        transition: background 0.18s ease;
    }
    .fleet-row:hover { background: rgba(255,255,255,0.035); }
    .fleet-row:last-child { border-bottom: none; }

    /* ── Skeleton Loader ── */
    @keyframes fleet-shimmer {
        0%   { background-position: -600px 0; }
        100% { background-position:  600px 0; }
    }
    .fleet-skeleton-row {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr 0.9fr 1.2fr 1.1fr 65px;
        gap: 10px;
        align-items: center;
        padding: 13px 20px;
        border-bottom: 1px solid rgba(255,255,255,0.025);
    }
    .fleet-skeleton-row:last-child { border-bottom: none; }
    .fleet-skel {
        border-radius: 6px;
        background: linear-gradient(
            90deg,
            rgba(255,255,255,0.04) 25%,
            rgba(255,255,255,0.10) 50%,
            rgba(255,255,255,0.04) 75%
        );
        background-size: 600px 100%;
        animation: fleet-shimmer 1.4s infinite linear;
    }
    .fleet-skeleton-cell {
        display: flex;
        align-items: center;
        gap: 8px;
    }
    .fleet-skel-avatar {
        width: 28px; height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
    }
    .fleet-skel-text  { height: 11px; border-radius: 6px; }
    .fleet-skel-badge { height: 20px; width: 54px; border-radius: 20px; }
    .fleet-skel-num   { height: 11px; width: 36px; border-radius: 6px; }
    .fleet-skel-dot   { height: 10px; width: 10px; border-radius: 50%; flex-shrink:0; }
    .fleet-skel-status{ height: 11px; width: 48px; border-radius: 6px; }
    .fleet-skel-time  { height: 11px; width: 64px; border-radius: 6px; }
    .fleet-skel-btn   { height: 26px; width: 30px; border-radius: 6px; }

    /* ── Username cell + custom tooltip ── */
    .fleet-name-cell {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100px;
        display: inline-block;
        vertical-align: middle;
    }
    .fleet-name-cell.is-truncated {
        position: relative;
        cursor: default;
        border-bottom: 1px dashed rgba(255,255,255,0.18);
    }
    .fleet-name-cell.is-truncated::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: calc(100% + 8px);
        left: 0;
        transform: translateY(4px);
        opacity: 0;
        pointer-events: none;
        background: rgba(10,11,16,0.92);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(0,229,155,0.25);
        color: #f3f4f6;
        font-size: 0.72rem;
        font-weight: 700;
        font-family: var(--font-ui);
        padding: 5px 10px;
        border-radius: 8px;
        white-space: nowrap;
        box-shadow: 0 8px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,229,155,0.08);
        transition: opacity 0.15s ease, transform 0.15s ease;
        z-index: 999;
        letter-spacing: 0.2px;
    }
    .fleet-name-cell.is-truncated:hover::after {
        opacity: 1;
        transform: translateY(0);
    }

    /* Actions Bar & Tools */
    .fleet-actions-bar {
        display: flex;
        align-items: center;
        gap: 10px;
    }
    .btn-fleet-tool {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.09);
        color: #d1d5db;
        font-size: 0.73rem;
        font-weight: 600;
        padding: 6px 13px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: var(--font-ui);
        transition: all 0.2s ease;
    }
    .btn-fleet-tool:hover {
        background: rgba(0,229,155,0.14);
        border-color: rgba(0,229,155,0.4);
        color: #fff;
    }

    /* Export Dropdown Menu */
    .fleet-export-dropdown { position: relative; }
    .fleet-export-menu {
        display: none;
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        background: #0d0e12;
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 10px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.6);
        z-index: 100;
        min-width: 140px;
        overflow: hidden;
        backdrop-filter: blur(12px);
    }
    .fleet-export-menu.show { display: block; animation: fadeIn 0.15s ease; }
    .fleet-export-item {
        padding: 9px 15px;
        font-size: 0.74rem;
        color: #e5e7eb;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 9px;
        transition: background 0.15s;
    }
    .fleet-export-item:hover {
        background: rgba(0,229,155,0.12);
        color: var(--primary, #00e59b);
    }

    /* ── Active Sessions Panel ── */
    .sessions-panel {
        border-radius: 16px;
        background: var(--bg-panel, rgba(15,15,17,0.65));
        display: flex;
        flex-direction: column;
        overflow: hidden;
        min-height: 0;
        height: 100%;
        border: 1px solid rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
    }
    .sessions-panel-head {
        padding: 13px 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        background: rgba(0,0,0,0.25);
        flex-shrink: 0;
    }
    .sessions-panel-title {
        font-size: 0.72rem;
        font-weight: 700;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        font-family: var(--font-ui);
    }
    .sessions-panel-title i { color: var(--secondary, #3b82f6); }

    /* Live count badge */
    .sessions-live-badge {
        font-size: 0.6rem;
        font-weight: 700;
        background: rgba(59,130,246,0.15);
        color: #3b82f6;
        border: 1px solid rgba(59,130,246,0.25);
        border-radius: 20px;
        padding: 1px 8px;
        letter-spacing: 0.5px;
        font-family: var(--font-data);
    }

    #sessionList {
        flex: 1;
        min-height: 0;
        overflow-y: auto !important;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        scrollbar-width: thin;
        scrollbar-color: rgba(59,130,246,0.25) transparent;
    }
    #sessionList::-webkit-scrollbar { width: 4px; }
    #sessionList::-webkit-scrollbar-track { background: transparent; }
    #sessionList::-webkit-scrollbar-thumb { background: rgba(59,130,246,0.25); border-radius: 4px; }
    #sessionList::-webkit-scrollbar-thumb:hover { background: rgba(59,130,246,0.5); }

    /* Session Card */
    .session-card {
        position: relative;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(255,255,255,0.025);
        border: 1px solid rgba(255,255,255,0.055);
        display: flex;
        align-items: center;
        gap: 10px;
        transition: background 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        overflow: hidden;
        cursor: default;
    }
    .session-card::after {
        content: '';
        position: absolute;
        left: 0; top: 0; bottom: 0;
        width: 2.5px;
        background: linear-gradient(180deg, #00e59b 0%, #3b82f6 100%);
        border-radius: 12px 0 0 12px;
        opacity: 0.8;
    }
    .session-card:hover {
        background: rgba(255,255,255,0.045);
        border-color: rgba(0,229,155,0.18);
        transform: translateX(3px);
    }

    /* Avatar circle */
    .session-avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: linear-gradient(135deg, rgba(0,229,155,0.25), rgba(59,130,246,0.25));
        border: 1px solid rgba(0,229,155,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.75rem;
        font-weight: 800;
        color: #00e59b;
        font-family: var(--font-ui);
        flex-shrink: 0;
        position: relative;
    }

    /* Pulse dot on avatar */
    .session-pulse {
        position: absolute;
        bottom: 0;
        right: 0;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #00e59b;
        border: 1.5px solid #0d0e12;
        box-shadow: 0 0 6px #00e59b;
    }
    .session-pulse::after {
        content: '';
        position: absolute;
        inset: -3px;
        border-radius: 50%;
        background: rgba(0,229,155,0.3);
        animation: pulse-ring 1.8s ease-out infinite;
    }
    @keyframes pulse-ring {
        0%   { opacity: 0.8; transform: scale(0.8); }
        100% { opacity: 0;   transform: scale(2.2); }
    }

    /* Card content */
    .session-info { flex: 1; min-width: 0; }
    .session-username {
        font-weight: 700;
        color: #f3f4f6;
        font-size: 0.8rem;
        font-family: var(--font-ui);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 3px;
    }
    .session-meta {
        font-size: 0.65rem;
        color: var(--text-muted);
        font-family: var(--font-data);
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
    }
    .session-meta i { opacity: 0.55; font-size: 0.6rem; }
    .session-activity {
        display: inline-block;
        margin-top: 4px;
        font-size: 0.58rem;
        color: #00e59b;
        font-family: var(--font-data);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        background: rgba(0,229,155,0.08);
        padding: 1px 6px;
        border-radius: 4px;
        border: 1px solid rgba(0,229,155,0.12);
    }

    /* IP link */
    .session-ip-link {
        cursor: pointer;
        color: #93c5fd;
        transition: color 0.15s;
        display: inline-flex;
        align-items: center;
        gap: 3px;
        font-family: var(--font-data);
    }
    .session-ip-link:hover { color: #60a5fa; text-decoration: underline; }

    /* Kick button */
    .session-kick-btn {
        background: rgba(239,68,68,0.08);
        border: 1px solid rgba(239,68,68,0.2);
        color: rgba(239,68,68,0.7);
        border-radius: 7px;
        padding: 4px 8px;
        font-size: 0.62rem;
        font-weight: 700;
        font-family: var(--font-ui);
        cursor: pointer;
        transition: all 0.17s;
        white-space: nowrap;
        flex-shrink: 0;
        letter-spacing: 0.3px;
    }
    .session-kick-btn:hover {
        background: rgba(239,68,68,0.18);
        border-color: rgba(239,68,68,0.4);
        color: #ef4444;
    }

    /* Empty state */
    .sessions-empty {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 40px 20px;
        color: var(--text-muted);
        font-size: 0.75rem;
        font-family: var(--font-data);
        text-align: center;
        opacity: 0.5;
    }
    .sessions-empty i { font-size: 1.8rem; opacity: 0.4; }
    </style>


<!-- ① Stat Cards -->
<div class="fleet-stat-grid">

    <div class="fleet-stat-card" style="--fsc: var(--primary, #00e59b);">
        <div class="fleet-stat-icon"><i class="fas fa-users-cog"></i></div>
        <div class="fleet-stat-info">
            <div class="fleet-stat-label">Total Operatives</div>
            <div class="fleet-stat-value" id="stat-total-operatives">0</div>
        </div>
    </div>

    <div class="fleet-stat-card" style="--fsc: var(--secondary, #3b82f6);">
        <div class="fleet-stat-icon" style="background: rgba(59,130,246,0.1); color: #3b82f6;">
            <i class="fas fa-satellite-dish"></i>
        </div>
        <div class="fleet-stat-info">
            <div class="fleet-stat-label">Active Sessions</div>
            <div class="fleet-stat-value" id="stat-active-sessions">0</div>
        </div>
    </div>

    <div class="fleet-stat-card" style="--fsc: var(--warning, #f59e0b);">
        <div class="fleet-stat-icon" style="background: rgba(245,158,11,0.1); color: #f59e0b;">
            <i class="fas fa-trophy"></i>
        </div>
        <div class="fleet-stat-info">
            <div class="fleet-stat-label">Total XP</div>
            <div class="fleet-stat-value" id="stat-total-xp" style="color: #f59e0b;">0</div>
        </div>
    </div>

    <div class="fleet-stat-card" style="--fsc: #a855f7;">
        <div class="fleet-stat-icon" style="background: rgba(168,85,247,0.1); color: #a855f7;">
            <i class="fas fa-chart-line"></i>
        </div>
        <div class="fleet-stat-info">
            <div class="fleet-stat-label">Average XP</div>
            <div class="fleet-stat-value" id="stat-avg-xp" style="color: #a855f7;">0</div>
        </div>
    </div>

</div>

<!-- ② Main Grid: Table + Sessions -->
<div class="fleet-main-grid">

    <!-- Left: Operative Table -->
    <div class="fleet-panel">
        <div class="fleet-panel-head">
            <div class="fleet-panel-title">
                <i class="fas fa-users"></i> Fleet Operatives
            </div>

            <div class="fleet-actions-bar">
                <!-- Search -->
                <div class="fleet-search-wrap">
                    <i class="fas fa-search"></i>
                    <input type="text" id="fleetSearch" placeholder="Search name, rank, status…">
                </div>

                <!-- Export Dropdown -->
                <div class="fleet-export-dropdown">
                    <button class="btn-fleet-tool" id="btnExportFleet" onclick="toggleExportMenu(event)">
                        <i class="fas fa-download"></i> Export <i class="fas fa-chevron-down" style="font-size:0.6rem;"></i>
                    </button>
                    <div class="fleet-export-menu" id="fleetExportMenu">
                        <div class="fleet-export-item" onclick="exportFleetData('csv')">
                            <i class="fas fa-file-csv" style="color:#00e59b;"></i> Export CSV
                        </div>
                        <div class="fleet-export-item" onclick="exportFleetData('json')">
                            <i class="fas fa-file-code" style="color:#3b82f6;"></i> Export JSON
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Column Headers -->
        <div class="fleet-table-head">
            <div class="fleet-sort-col" onclick="sortFleet('username')">
                Name <span id="sort-username-icon" style="opacity:0.35; font-size:0.7rem;">↕</span>
            </div>
            <div class="fleet-sort-col" onclick="sortFleet('rank')">
                Rank <span id="sort-rank-icon" style="opacity:0.35; font-size:0.7rem;">↕</span>
            </div>
            <div class="fleet-sort-col" onclick="sortFleet('points')">
                XP <span id="sort-points-icon" style="opacity:0.35; font-size:0.7rem;">↕</span>
            </div>
            <div class="fleet-sort-col" onclick="sortFleet('is_active')">
                Status <span id="sort-is_active-icon" style="opacity:0.35; font-size:0.7rem;">↕</span>
            </div>
            <div class="fleet-sort-col" onclick="sortFleet('last_active')">
                Last Active <span id="sort-last_active-icon" style="opacity:0.35; font-size:0.7rem;">↕</span>
            </div>
            <div>Actions</div>
        </div>


        <!-- Scrollable Rows (JS renders here) -->
        <div id="fleet-body-list" class="fleet-table-body">
            <div id="fleet-skeleton">
                <div class="fleet-skeleton-row">
                    <div class="fleet-skeleton-cell"><div class="fleet-skel fleet-skel-avatar"></div><div class="fleet-skel fleet-skel-text" style="width:70px;"></div></div>
                    <div style="display:flex;justify-content:center;"><div class="fleet-skel fleet-skel-badge"></div></div>
