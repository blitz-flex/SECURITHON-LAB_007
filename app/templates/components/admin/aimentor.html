<!-- Tab: AI Agent & Mentor Analytics -->
<div id="tab-aimentor" class="tab-content {% if active_admin_tab == 'aimentor' %}active{% endif %}">
<style>
    /* ── AI Analytics Premium Styling ── */
    .ai-stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
        margin-bottom: 24px;
    }
    .ai-stat-card {
        position: relative;
        padding: 18px 20px;
        border-radius: 14px;
        background: var(--bg-panel, rgba(15,15,17,0.65));
        border: 1px solid rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: transform 0.22s ease, background 0.22s ease, border-color 0.22s ease;
        overflow: hidden;
    }
    .ai-stat-card::before {
        content: '';
        position: absolute;
        left: 0; top: 14px; bottom: 14px;
        width: 3px;
        border-radius: 3px;
        background: var(--aic, #00e59b);
        box-shadow: 0 0 8px var(--aic, #00e59b);
    }
    .ai-stat-card:hover {
        transform: translateY(-2px);
        background: rgba(255,255,255,0.035);
        border-color: rgba(255,255,255,0.12);
    }
    .ai-stat-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
    }
    .ai-stat-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: rgba(var(--aic-rgb, 0,229,155), 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.95rem;
        color: var(--aic, #00e59b);
    }
    .ai-stat-badge {
        font-size: 0.65rem;
        font-weight: 700;
        font-family: var(--font-data);
        color: var(--aic, #00e59b);
        background: rgba(var(--aic-rgb, 0,229,155), 0.12);
        border: 1px solid rgba(var(--aic-rgb, 0,229,155), 0.2);
        padding: 2px 8px;
        border-radius: 20px;
        letter-spacing: 0.5px;
    }
    .ai-stat-label {
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        font-family: var(--font-data);
        margin-bottom: 4px;
    }
    .ai-stat-value {
        font-size: 1.5rem;
        font-weight: 800;
        font-family: var(--font-data);
        color: #fff;
        line-height: 1;
    }

    /* Main Grid */
    .ai-main-grid {
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 20px;
        margin-bottom: 24px;
    }
    .ai-panel {
        border-radius: 16px;
        background: var(--bg-panel, rgba(15,15,17,0.65));
        border: 1px solid rgba(255,255,255,0.06);
        backdrop-filter: blur(12px);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    }
    .ai-panel-head {
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        background: rgba(0,0,0,0.25);
    }
    .ai-panel-title {
        font-size: 0.78rem;
        font-weight: 700;
        color: #fff;
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-ui);
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Table Styles */
    .ai-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }
    .ai-table th {
        padding: 11px 18px;
        font-family: var(--font-data);
        font-size: 0.65rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        font-weight: 700;
        border-bottom: 1px solid rgba(255,255,255,0.04);
        background: rgba(0,0,0,0.15);
    }
    .ai-table td {
        padding: 12px 18px;
        border-bottom: 1px solid rgba(255,255,255,0.025);
        font-size: 0.78rem;
    }
    .ai-table tr:hover td {
        background: rgba(255,255,255,0.02);
    }

    /* Question Pill */
    .q-category-tag {
        font-size: 0.62rem;
        font-family: var(--font-data);
        font-weight: 700;
        padding: 2px 7px;
        border-radius: 4px;
        text-transform: uppercase;
    }
</style>

    <!-- 1. Top Stat Cards -->
    <div class="ai-stat-grid">
        <div class="ai-stat-card" style="--aic: #a855f7; --aic-rgb: 168,85,247;">
            <div class="ai-stat-top">
                <div class="ai-stat-icon"><i class="fas fa-brain"></i></div>
                <span class="ai-stat-badge">LIVE ANALYTICS</span>
            </div>
            <div>
                <div class="ai-stat-label">Total Prompts Handled</div>
                <div class="ai-stat-value" id="ai-stat-total-prompts">0</div>
            </div>
        </div>

        <div class="ai-stat-card" style="--aic: #00e59b; --aic-rgb: 0,229,155;">
            <div class="ai-stat-top">
                <div class="ai-stat-icon"><i class="fas fa-microchip"></i></div>
                <span class="ai-stat-badge">OPTIMAL</span>
            </div>
            <div>
                <div class="ai-stat-label">Tokens Consumed</div>
                <div class="ai-stat-value" id="ai-stat-tokens">0k</div>
            </div>
        </div>

        <div class="ai-stat-card" style="--aic: #3b82f6; --aic-rgb: 59,130,246;">
            <div class="ai-stat-top">
                <div class="ai-stat-icon"><i class="fas fa-bolt"></i></div>
                <span class="ai-stat-badge">FAST</span>
            </div>
            <div>
                <div class="ai-stat-label">Avg Response Time</div>
                <div class="ai-stat-value" id="ai-stat-avg-time">-</div>
            </div>
        </div>

        <div class="ai-stat-card" style="--aic: #f59e0b; --aic-rgb: 245,158,11;">
            <div class="ai-stat-top">
                <div class="ai-stat-icon"><i class="fas fa-thumbs-up"></i></div>
                <span class="ai-stat-badge">HIGH RATING</span>
            </div>
            <div>
                <div class="ai-stat-label">Helpfulness Score</div>
                <div class="ai-stat-value" id="ai-stat-helpfulness">-</div>
            </div>
        </div>
    </div>

    <!-- 2. Main Analytics Grid -->
    <div class="ai-main-grid">
        <!-- Live AI Query Feed -->
        <div class="ai-panel">
            <div class="ai-panel-head">
                <div class="ai-panel-title">
                    <i class="fas fa-comments" style="color:var(--primary);"></i> Live Student AI Interactions
                </div>
                <span style="font-size:0.62rem; font-family:var(--font-data); color:var(--primary); background:rgba(0,229,155,0.1); padding:2px 8px; border-radius:12px; border:1px solid rgba(0,229,155,0.2);">
                    REALTIME STREAM
                </span>
            </div>
            <div style="max-height:340px; overflow-y:auto;">
                <table class="ai-table">
                    <thead>
                        <tr>
                            <th>Student</th>
                            <th>Category</th>
                            <th>Prompt Summary</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody id="aiQueryFeedBody">
                        <tr>
                            <td colspan="4" style="text-align:center; color:var(--text-muted); padding:30px; font-size:0.75rem;">
                                <i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i> Loading live AI database analytics...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Quota & Topic Breakdown -->
        <div class="ai-panel">
            <div class="ai-panel-head">
                <div class="ai-panel-title">
                    <i class="fas fa-chart-pie" style="color:#a855f7;"></i> Frequently Asked Cyber Topics
                </div>
                <span style="font-size:0.62rem; font-family:var(--font-data); color:#a855f7; background:rgba(168,85,247,0.1); padding:2px 8px; border-radius:12px; border:1px solid rgba(168,85,247,0.2);">
                    TOPIC ANALYTICS
                </span>
            </div>
            <div id="aiTopicContainer" style="padding:18px; display:flex; flex-direction:column; gap:14px;">
            </div>
        </div>
    </div>
</div>
