<article class="incident-card {{ incident.severity | lower }}" role="listitem">
    <div class="card-header">
        <span class="severity-pill">
            <i class="fas {% if incident.severity == 'CRITICAL' %}fa-skull-crossbones{% elif incident.severity == 'HIGH' %}fa-exclamation-triangle{% else %}fa-info-circle{% endif %}"></i>
            {{ incident.severity }}
        </span>
        <span class="year-badge">{{ incident.year }}</span>
    </div>
    
    <h2 class="incident-title">{{ incident.title }}</h2>
    
    <div class="incident-meta">
        <span class="cve-badge">
            <i class="fas {% if 'Supply Chain' in incident.cve %}fa-project-diagram{% else %}fa-bug{% endif %}"></i>
            {{ incident.cve }}
        </span>
    </div>
    
    <p class="incident-desc">{{ incident.desc }}</p>
    
    <div class="card-footer">
        <div class="cvss-score">
            <span class="cvss-label">CVSS Score</span>
            <span>{{ incident.cvss }}</span>
        </div>
        <a href="#" class="btn-analyze">
            Analyze <i class="fas fa-arrow-right"></i>
        </a>
    </div>
</article>
